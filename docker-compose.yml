services:
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "5001:5001"
      - "50051:50051"
    environment:
      PORT: 5001
      MONGO_URL: mongodb://mongo:27017/userservice_db
    depends_on:
      mongo:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      DATABASE_URL: postgresql://postgres:Shejin08@@postgres:5432/orderservice_db
      USER_SERVICE_GRPC_URL: user-service:50051
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  mongo:
    image: mongo:8
    ports:
    - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Shejin08@
      POSTGRES_DB: orderservice_db
    ports:
    - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  postgres_data: